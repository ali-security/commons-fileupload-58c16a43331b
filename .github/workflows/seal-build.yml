name: seal-build

# Upstream commons-fileupload 1.3.2 has no GitHub Actions CI; this workflow
# reproduces the project's own Maven build (commons-parent 40) and test suite.
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional surefire -Dtest selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Reference jar manifest: Build-Jdk 1.8.0_65 (source/target 1.5 cross-compiled).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Maven 3.3.9
        run: |
          curl -fsSL -o /tmp/maven.tar.gz https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.3.9/apache-maven-3.3.9-bin.tar.gz
          sudo tar -xzf /tmp/maven.tar.gz -C /opt
          echo "/opt/apache-maven-3.3.9/bin" >> "$GITHUB_PATH"

      # -Prelease: commons-parent 40 binds jar:test-jar (the -tests.jar) only in its release profile.
      # Lint/report/signing gates are skipped; they never execute the code under test.
      - name: Build and test
        env:
          MAVEN_OPTS: -Xmx1g -Duser.name=britter
        run: |
          GATES="-Drat.skip=true -Dcheckstyle.skip=true -Dfindbugs.skip=true -Dpmd.skip=true -Dcpd.skip=true -Dclirr.skip=true -Danimal.sniffer.skip=true -Djapicmp.skip=true -Djacoco.skip=true -Dcobertura.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dgpg.skip=true -Dassembly.skipAssembly=true"
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn -B -V -e clean package -Prelease $GATES -Dtest='${{ inputs.test-filter }}' -DfailIfNoTests=false
          else
            mvn -B -V -e clean package -Prelease $GATES
          fi

      - name: Print test results
        if: always()
        run: |
          for f in target/surefire-reports/*.txt; do sed -n 4p "$f"; done
          echo "Skipped tests (with reasons):"
          grep -h -B1 "<skipped" target/surefire-reports/*.xml || echo "none"

      - name: Collect release jars
        run: |
          mkdir -p release-out
          cp target/commons-fileupload-1.3.2.jar target/commons-fileupload-1.3.2-tests.jar release-out/
          ls -l release-out

      - uses: actions/upload-artifact@v4
        with:
          name: commons-fileupload-jars
          path: release-out/*.jar
          if-no-files-found: error
